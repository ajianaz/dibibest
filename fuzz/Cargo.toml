[package]
name = "dibibest-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
dibibest-core = { path = "../crates/dibibest-core" }

# Detached from the main workspace (needs nightly + libFuzzer).
[workspace]

[[bin]]
name = "fuzz_dbml_parse"
path = "fuzz_targets/fuzz_dbml_parse.rs"
test = false
doc = false

[[bin]]
name = "fuzz_sql_parse"
path = "fuzz_targets/fuzz_sql_parse.rs"
test = false
doc = false
