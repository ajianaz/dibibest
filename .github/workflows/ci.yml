name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace

  mcp-smoke:
    name: MCP Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: MCP server responds to initialize + tools/list + convert
        run: |
          cargo build -q -p dibibest-mcp
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | ./target/debug/dibibest-mcp | grep -q '"serverInfo"'
          echo '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' | ./target/debug/dibibest-mcp | grep -q 'convert_schema'
          echo '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"convert_schema","arguments":{"source":"Table a { id integer [pk] }","to":"sql"}}}' \
            | ./target/debug/dibibest-mcp | grep -q '"isError":false'
