name: Source Branch Check

# PRs into `main` must come from `develop` or a `chore/release-*` branch.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-branch-check:
    name: Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" = "main" ]; then
            case "$HEAD_REF" in
              develop|chore/release-*)
                echo "OK: source branch allowed ($HEAD_REF)."
                ;;
              *)
                echo "::error::PRs into 'main' are only accepted from 'develop' (or a 'chore/release-*' release branch)."
                exit 1
                ;;
            esac
          else
            echo "OK: base branch is not 'main'."
          fi
